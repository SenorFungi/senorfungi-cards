name: HACS validation
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          # A README screenshot is only required for the HACS default store.
          # Remove this line once the README shows a card image.
          ignore: images
